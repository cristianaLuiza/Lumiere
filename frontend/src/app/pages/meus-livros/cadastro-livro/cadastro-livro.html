<div class="modal-overlay">
  <button class="btn-close" (click)="fecharModal()">
  <i class="fa-solid fa-xmark"></i>
</button>

  <div class="modal-book">

    <div class="modal-header">
      <h2>Adicionar um novo livro</h2>

      <button class="btn-close">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>

    <div class="form-grid">

      <div class="form-group">
        <label>Título</label>
        <input
          type="text"
          [(ngModel)]="novoLivro.titulo"
          placeholder="Digite o título">
      </div>

      <div class="form-group">
        <label>Autor</label>
        <input
          type="text"
          [(ngModel)]="novoLivro.autor"
          placeholder="Digite o autor">
      </div>

      <div class="form-group">
        <label>Gênero</label>
        <select [(ngModel)]="novoLivro.generoLivro">

          <option value="">Selecione</option>

          <option value="Romance">Romance</option>
          <option value="Fantasia">Fantasia</option>
          <option value="Ficcao">Ficção</option>
          <option value="Cientifica">Científica</option>
          <option value="Suspense">Suspense</option>
          <option value="Policial">Policial</option>
          <option value="Terror">Terror</option>
          <option value="Historica">Histórica</option>

        </select>
      </div>

      <div class="form-group">
        <label>Modalidade</label>

        <select [(ngModel)]="novoLivro.tipoInteracao">

          <option value="">Selecione</option>

          <option value="DOACAO">Doação</option>
          <option value="TROCA">Troca</option>
          <option value="EMPRESTIMO">Empréstimo</option>

        </select>
      </div>

    </div>

    <div class="form-group">
      <label>Imagem da capa</label>

      <input
        type="text"
        [(ngModel)]="novoLivro.imagemUrl"
        placeholder="Cole a URL da imagem">
    </div>

    <div class="form-group">
      <label>Descrição</label>

      <textarea
        rows="4"
        [(ngModel)]="novoLivro.descricao"
        placeholder="Conte um pouco sobre o livro">
      </textarea>
    </div>

    <div class="modal-actions">

     <button
  type="button"
  class="btn-cancel"
  (click)="fecharModal()">
  Cancelar
</button>

      <button
        type="button"
        class="btn-save"
        (click)="salvarLivro()">
        Salvar Livro
      </button>

    </div>

  </div>

</div>
