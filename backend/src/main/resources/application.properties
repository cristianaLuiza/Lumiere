server.port=8081

# Conexão com o SQL Server via Autenticação do Windows (Integrated Security)
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=biblioteca_comunitaria;encrypt=true;trustServerCertificate=true
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Deixe o usuário e senha vazios pois usará as credenciais do Windows
spring.datasource.username=root
spring.datasource.password=root

# Configurações do Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Cria/atualiza views, functions, procedures e triggers depois que o Hibernate gera as tabelas
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/objetos.sql
spring.sql.init.separator=GO
spring.sql.init.encoding=UTF-8

# Limite de tamanho para upload de imagens
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB